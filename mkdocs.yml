site_name: Notas a mano sobre análisis orientado a objetos y patrones de diseño
site_description: "Complemento digital de la primera edición: orientación a objetos, principios, buenas prácticas y patrones de diseño."
site_author: Carlos Eduardo Orozco Garcés, César Jesús Pardo Calvache y Eydy del Carmen Suárez Brieva
site_url: https://notas-a-mano-serie-de-libros.github.io/2_notas-a-mano-sobre-analisis-orientado-objetos-patrones-diseno/
repo_url: https://github.com/Notas-a-Mano-serie-de-libros/2_notas-a-mano-sobre-analisis-orientado-objetos-patrones-diseno
repo_name: Ver repositorio
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: notas-light
      toggle:
        icon: material/weather-night
        name: Usar modo oscuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Usar modo claro
  font: false

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/design-system.css

extra_javascript:
  - assets/javascripts/site.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Capítulo 2 · Introducción al diseño orientado a objetos:
      - Visión general: capitulos/capitulo-2.md
      - Programación orientada a objetos:
          - Visión general: capitulos/capitulo-2/programacion-orientada-a-objetos.md
          - Clase: capitulos/capitulo-2/clase.md
          - Objeto: capitulos/capitulo-2/objeto.md
          - Pilares de la programación orientada a objetos:
              - Abstracción: capitulos/capitulo-2/abstraccion-elegir-que-representa-el-modelo.md
              - Encapsulamiento: capitulos/capitulo-2/encapsulamiento-y-visibilidad.md
              - Herencia: capitulos/capitulo-2/herencia-clases-abstractas-e-interfaces.md
              - Polimorfismo: capitulos/capitulo-2/polimorfismo.md
      - Diseño orientado a objetos:
          - Visión general: capitulos/capitulo-2/diseno-orientado-a-objetos.md
          - Relaciones entre clases:
              - Visión general: capitulos/capitulo-2/relaciones-entre-clases.md
              - Dependencia: capitulos/capitulo-2/relacion-dependencia.md
              - Asociación: capitulos/capitulo-2/relacion-asociacion.md
              - Agregación: capitulos/capitulo-2/relacion-agregacion.md
              - Composición: capitulos/capitulo-2/relacion-composicion.md
              - Generalización: capitulos/capitulo-2/relacion-generalizacion.md

copyright: © 2025 Carlos Eduardo Orozco Garcés, César Jesús Pardo Calvache y Eydy del Carmen Suárez Brieva
